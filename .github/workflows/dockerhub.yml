name: Build and publish image on Docker Hub

# Automatické sestavení je vypnuté - obraz se publikuje pod účtem původního
# autora (janch32) a v této forku k tomu nejsou nastavené secrets.
# Workflow lze v případě potřeby spustit ručně přes záložku Actions.
on:
  workflow_dispatch:

jobs:
  build_docker_image:
    name: Build and push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: janch32/web-scraper-nabidek-pronajmu:latest
